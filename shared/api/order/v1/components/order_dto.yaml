type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - status
properties:
  order_uuid:
    type: string
    description: Uuid заказа
  user_uuid:
    type: string
    description: Uuid пользователя
  part_uuids:
    type: array
    items: 
      type: string
    description: Uuids деталей заказа
  total_price: 
    type: number
    format: float
    description: Общая цена
    example: 123.45
  transaction_uuid:
    type: string
    description: Uuid транзакции
  payment_method:
    $ref: ./enums/payment_method.yaml
  status:
    $ref: ./enums/order_status.yaml
   
  