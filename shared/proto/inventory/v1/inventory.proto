syntax = "proto3";

// Сервис, отвечающий за хранение и предоставление информации о деталях для сборки космических кораблей.
package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/alex100010/microservices-course/hw/hw_1/pkg/proto/inventory/v1;inventory_v1";

// InventoryService, отвечающий за хранение и предоставление информации о деталях для сборки космических кораблей.
service InventoryService {
  // Записывает информацию о новой детали
  rpc CreatePart(CreatePartRequest) returns (CreatePartResponse);

  //Возвращает информацию о детали по её UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  //Возвращает список деталей с возможностью фильтрации
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

//Запрос на создание новой детали
message CreatePartRequest {
  Info info = 1;
}

//Ответ на запрос о создании новой детали
message CreatePartResponse {
  string uuid = 1;
}
//Запрос на возвращение информацию о детали по её UUID.
message GetPartRequest {
  //Идентификатор детали
  string uuid = 1;
}

//Ответ с данными о детали
message GetPartResponse {
  //Информация о детали
  Part part = 1;
}

//Запрос на возвращение списка деталей с возможностью фильтрации
message ListPartsRequest {
  //Фильтр по деталям (все поля опциональны)
  PartsFilter filter = 1;
}

//Ответ на возвращение списка деталей с возможностью фильтрации
message ListPartsResponse {
  //Список найденных деталей
  repeated Part parts = 1;
}

//Информация о детали
message Part {
  //Уникальный идентификатор детали
  string uuid = 1;

  //Информация о детали
  Info info = 2;

  //Дата создания
  google.protobuf.Timestamp created_at = 3;

  //Дата обновления
  google.protobuf.Timestamp updated_at = 4;
}

//Информация о детали
message Info {
  //Название детали
  string name = 1;

  //Описание детали
  string description = 2;

  //Цена за единицу
  double price = 3;

  //Количество на складе
  int64 stock_quantity = 4;

  //Категория
  Category category = 5;

  //Размеры детали
  Dimensions dimensions = 6;

  //Информация о производителе
  Manufacturer manufacturer = 7;

  //Теги для быстрого поиска
  repeated string tags = 8;

  //Гибкие метаданные
  map<string, CustomValue> metadata = 9;
}

//Информация о размерах детали
message Dimensions {
  //Длина в см
  double length = 1;

  //Ширина в см
  double width = 2;

  //Высота в см
  double height = 3;

  //Вес в кг
  double weight = 4;
}

//Информация о производителе
message Manufacturer {
  //Название
  string name = 1;

  //Страна производства
  string country = 2;

  //Сайт производителя
  string website = 3;
}

//Создаем сообщение-обертку с конструкцией oneof
message CustomValue {
  oneof kind {
    string string_value = 1;
    int64 int64_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

//Информация о доступных категориях
enum Category {
  //Неизвестная категория
  CATEGORY_UNSPECIFIED = 0;

  //Двигатель
  CATEGORY_ENGINE = 1;

  //Топливо
  CATEGORY_FUEL = 2;

  //Иллюминатор
  CATEGORY_PORTHOLE = 3;

  //Крыло
  CATEGORY_WING = 4;
}

//Список деталей с возможностью фильтрации
message PartsFilter {
  //Список UUID'ов. Пусто — не фильтруем по UUID
  repeated string uuids = 1;

  //Список имён. Пусто — не фильтруем по имени
  repeated string names = 2;

  //Список категорий. Пусто — не фильтруем по категории
  repeated Category categories = 3;

  //Список стран производителей. Пусто — не фильтруем по стране
  repeated string manufacturer_countries = 4;

  //Список тегов. Пусто — не фильтруем по тегам
  repeated string tags = 5;
}
