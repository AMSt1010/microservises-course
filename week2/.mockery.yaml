with-expecter: true
boilerplate-file: ".mockery_boilerplate_text.txt"
dir: "{{.InterfaceDir}}/mocks"
filename: "mock_{{.InterfaceNameSnake}}.go"
outpkg: "mocks"
mockname: "{{.InterfaceName}}"
resolve-type-alias: False
issue-845-fix: True

packages:
  github.com/AMSt1010/microservises-course/week2/inventory/internal/repository:
    config:
      include-regex: ".*Repository"
  github.com/AMSt1010/microservises-course/week2/inventory/internal/service:
    config:
      include-regex: ".*Service"
  github.com/AMSt1010/microservises-course/week2/payment/internal/service:
    config:
      include-regex: ".*Service"

